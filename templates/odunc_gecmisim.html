<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ödünç Geçmişim</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background: url("{{ url_for('static', filename='images/kedi4.png') }}")
          center/cover no-repeat;
        backdrop-filter: blur(6px);
        color: #333;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .container {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        padding: 30px 40px;
        max-width: 1000px;
        width: 90%;
        margin-top: 60px;
        animation: fadeIn 0.6s ease;
      }

      h2 {
        text-align: center;
        font-size: 26px;
        margin-bottom: 25px;
        color: #3a3a3a;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 10px;
        overflow: hidden;
      }

      th {
        background-color: #ffcf70;
        color: #333;
        padding: 12px;
        text-align: left;
        font-weight: 600;
      }

      td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
      }

      tr:hover {
        background-color: #fff7e6;
        transition: 0.2s;
      }

      input[type="text"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 15px;
      }

      footer {
        margin: 30px 0 20px 0;
        text-align: center;
      }

      footer a {
        text-decoration: none;
        color: #ffb347;
        font-weight: bold;
        transition: 0.3s;
      }

      footer a:hover {
        color: #ff9933;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 600px) {
        th,
        td {
          font-size: 14px;
          padding: 8px;
        }
        h2 {
          font-size: 22px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Ödünç Geçmişim - {{ username }}</h2>

      <input
        type="text"
        id="searchInput"
        placeholder=" Kitap veya tarih ara..."
      />

      <table id="oduncTable">
        <thead>
          <tr>
            <th>Ödünç ID</th>
            <th>Kitap</th>
            <th>Ödünç Tarihi</th>
            <th>Gerekli İade Tarihi</th>
            <th>Gerçek İade Tarihi</th>
          </tr>
        </thead>
        <tbody>
          {% for odunc in odunc_gecmisi %}
          <tr>
            <td>{{ odunc.id }}</td>
            <td>{{ odunc.kitap_adi }}</td>
            <td>{{ odunc.odunc_tarihi }}</td>
            <td>{{ odunc.gerekli_iade_tarihi }}</td>
            <td>{{ odunc.gercek_iade_tarihi or "-" }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>

      <footer>
        <a href="/kullanici/{{ username }}">← Geri Dön</a>
      </footer>
    </div>

    <script>
      const searchInput = document.getElementById("searchInput");
      searchInput.addEventListener("keyup", function () {
        const filter = searchInput.value.toLowerCase();
        const rows = document.querySelectorAll("#oduncTable tbody tr");
        rows.forEach((row) => {
          const text = row.textContent.toLowerCase();
          row.style.display = text.includes(filter) ? "" : "none";
        });
      });
    </script>
  </body>
</html>
