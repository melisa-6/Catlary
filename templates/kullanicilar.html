<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Kullanıcılar</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        background: linear-gradient(
            rgba(255, 192, 203, 0.5),
            rgba(255, 182, 193, 0.5)
          ),
          url("{{ url_for('static', filename='images/kedi4.png') }}") no-repeat
            center center fixed;
        background-size: cover;
        background-blend-mode: overlay;
        color: #333;
      }

      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 50px 20px;
      }

      h2 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 2em;
        color: #b3477a;
      }

      table {
        border-collapse: collapse;
        width: 80%;
        max-width: 800px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        border-radius: 12px;
        overflow: hidden;
        background: rgba(255, 240, 245, 0.95);
        animation: fadeIn 0.8s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      th,
      td {
        padding: 12px 15px;
        text-align: center;
      }

      th {
        background-color: #f4a6c1;
        color: white;
        font-weight: 600;
      }

      tr:nth-child(even) {
        background-color: rgba(255, 228, 235, 0.6);
      }

      tr:hover {
        background-color: rgba(255, 192, 203, 0.3);
        transition: 0.3s;
      }

      .aktif {
        color: green;
        font-weight: 600;
      }

      .pasif {
        color: #d14f70;
        font-weight: 600;
      }

      .aktiflestir-btn {
        margin-left: 5px;
        padding: 4px 8px;
        font-size: 0.8em;
        cursor: pointer;
        border-radius: 8px;
        border: none;
        background-color: #f4a6c1;
        color: white;
        transition: 0.3s;
      }

      .aktiflestir-btn:hover {
        background-color: #d14f70;
      }

      footer {
        text-align: center;
        padding: 20px 0;
      }

      footer a {
        text-decoration: none;
        color: white;
        font-weight: 500;
        font-size: 0.9em;
        background-color: #f4a6c1;
        padding: 6px 12px;
        border-radius: 8px;
        transition: 0.3s;
      }

      footer a:hover {
        background-color: #d14f70;
        color: white;
      }

      @media (max-width: 768px) {
        th,
        td {
          padding: 10px 8px;
          font-size: 0.9em;
        }
        h2 {
          font-size: 1.5em;
        }
      }

      @media (max-width: 480px) {
        table {
          width: 95%;
        }
      }
    </style>
  </head>
  <body>
    <div class="content">
      <h2>Kullanıcı Listesi</h2>
      <table>
        <tr>
          <th>ID</th>
          <th>Kullanıcı Adı</th>
          <th>Email</th>
          <th>Durum</th>
        </tr>
        {% for id, username, email, aktiflik in kullanicilar %}
        <tr>
          <td>{{ id }}</td>
          <td>{{ username }}</td>
          <td>{{ email }}</td>
          <td class="{{ 'aktif' if aktiflik else 'pasif' }}">
            {{ 'Aktif' if aktiflik else 'Pasif' }} {% if not aktiflik %}
            <form
              method="POST"
              action="{{ url_for('kullanici_aktiflestir', kullanici_id=id) }}"
              style="display: inline"
            >
              <button type="submit" class="aktiflestir-btn">Aktifleştir</button>
            </form>
            {% endif %}
          </td>
        </tr>
        {% endfor %}
      </table>
    </div>

    <footer>
      <a href="/admin/{{ admin_username }}">← Geri Dön</a>
    </footer>
  </body>
</html>
