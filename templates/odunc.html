<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Ödünç Verme Sonucu</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
            rgba(220, 235, 255, 0.7),
            rgba(200, 220, 255, 0.7)
          ),
          url("{{ url_for('static', filename='images/kedi4.png') }}") no-repeat
            center center fixed;
        background-size: cover;
        background-blend-mode: overlay;
      }

      .sonuc {
        display: inline-block;
        padding: 30px 40px;
        border-radius: 15px;
        background: rgba(235, 245, 255, 0.95);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        max-width: 400px;
        width: 90%;
        text-align: center;
        animation: fadeIn 0.8s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .sonuc h2 {
        margin-bottom: 20px;
        color: #2b3e70;
      }

      .sonuc p {
        margin: 10px 0;
        font-size: 1em;
        color: #3a4f8a;
      }

      button {
        margin-top: 20px;
        padding: 12px 25px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 10px;
        background: #7da6ff;
        color: white;
        transition: 0.3s;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      button:hover {
        background: #5a84d6;
      }

      @media (max-width: 480px) {
        .sonuc {
          padding: 20px;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="sonuc">
      <h2>Ödünç Verme Sonucu</h2>
      <p>{{ mesaj|safe }}</p>
      <button onclick="window.location.href='/admin/{{ username }}'">
        Geri Dön
      </button>
    </div>
  </body>
</html>
