<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitap Ödünç Ver</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
      /* --- GENEL SAYFA TASARIMI --- */
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

        /* Arka Plan */
        background: url("{{ url_for('static', filename='images/cats2.png') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        background: #ffffff;
        padding: 35px 40px;
        border-radius: 18px;
        width: 100%;
        max-width: 460px; /* Select2 genişliği için biraz artırdık */
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #4a5568;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 600;
        margin-top: 15px;
      }

      input[type="date"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #d1d9e6;
        font-size: 15px;
        background: #f9fafc;
        box-sizing: border-box;
      }

      button {
        width: 100%;
        margin-top: 30px;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        background: linear-gradient(135deg, #8b9cff, #6b7cff);
        color: white;
        transition: 0.3s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(107, 124, 255, 0.35);
      }

      .back-link {
        display: block;
        margin-top: 20px;
        text-align: center;
        text-decoration: none;
        color: #6b7cff;
        font-weight: 500;
        font-size: 14px;
      }

      .back-link:hover {
        color: #4f5fe3;
      }

      /* Mesaj Kutuları (Flash) */
      .flash {
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
      }
      .flash.success {
        background: #e6f6ee;
        color: #1e7f4f;
        border: 1px solid #c3e6cb;
      }
      .flash.danger {
        background: #fdecea;
        color: #a12722;
        border: 1px solid #f5c6cb;
      }
      .flash.error {
        background: #fdecea;
        color: #a12722;
        border: 1px solid #f5c6cb;
      }

      .select2-container .select2-selection--single {
        height: 45px !important; /* Yükseklik */
        border-radius: 10px !important; /* Köşeler */
        border: 1px solid #d1d9e6 !important;
        background-color: #f9fafc !important;
        display: flex;
        align-items: center;
      }

      .select2-container--default
        .select2-selection--single
        .select2-selection__arrow {
        height: 42px !important;
      }

      .select2-container--default
        .select2-selection--single
        .select2-selection__rendered {
        padding-left: 14px;
        color: #333;
        font-size: 15px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>Kitap Ödünç Ver</h2>

      {% with messages = get_flashed_messages(with_categories=true) %} {% for
      category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %} {% endwith %}

      <form method="POST">
        <label>Kullanıcı Seç (Mail veya İsim)</label>
        <select
          name="kullanici_mail"
          class="arama-yapilabilir"
          style="width: 100%"
          required
        >
          <option value="">Kullanıcı aramak için yazın...</option>

          {% for k in kullanicilar %}
          <option value="{{ k['email'] }}">
            {{ k['email'] }} {% if k['ad'] %} - {{ k['ad'] }} {{ k['soyad'] }}
            {% endif %}
          </option>
          {% endfor %}
        </select>

        <label>Kitap Seç (İsim veya Yazar)</label>
        <select
          name="kitap_id"
          class="arama-yapilabilir"
          style="width: 100%"
          required
        >
          <option value="">Kitap aramak için yazın...</option>

          {% for kitap in kitaplar %}
          <option value="{{ kitap['id'] }}">
            {{ kitap['isim'] }} {% if kitap['yazar_isim'] %} ({{
            kitap['yazar_isim'] }}) {% endif %} - Stok: {{ kitap['stok'] }}
          </option>
          {% endfor %}
        </select>

        <label>Verildiği Tarih</label>
        <input type="date" name="verildigi_tarih" required />

        <button type="submit">Ödünç İşlemini Tamamla</button>
      </form>

      <a href="{{ geri_donus_url }}" class="back-link">
        {{ geri_donus_text }}
      </a>
    </div>

    <script>
      $(document).ready(function () {
        $(".arama-yapilabilir").select2({
          placeholder: "Seçim yapmak için yazın...",
          allowClear: true,
          language: {
            noResults: function () {
              return "Sonuç bulunamadı";
            },
          },
        });
      });
    </script>
  </body>
</html>
