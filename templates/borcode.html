<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borç Ödeme - PayTR Test</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #f0f4f8, #d6f0f0);
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #333;
      }
      header {
        width: 100%;
        text-align: center;
        padding: 25px 0;
        color: #4b4b8f;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        font-size: 28px;
        font-weight: bold;
        background-color: #e0f7fa;
      }
      main {
        flex: 1;
        width: 90%;
        max-width: 500px;
        background: #ffffffcc;
        margin: 30px 0;
        padding: 30px 25px;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        animation: fadeIn 0.8s ease-in-out;
        text-align: center;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      p {
        font-size: 18px;
        margin: 20px 0;
      }
      .borc {
        font-size: 26px;
        font-weight: bold;
        color: #ff6b6b;
      }
      /* Dinamik Alert Stilleri */
      .alert {
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 20px;
        font-weight: 600;
        list-style: none;
      }
      .alert-danger {
        background-color: #ffe5e5;
        color: #d32f2f;
        border: 1px solid #ffcccc;
      }
      .alert-success {
        background-color: #e5fff2;
        color: #388e3c;
        border: 1px solid #ccffe0;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
        align-items: center;
      }
      input[type="text"],
      input[type="number"],
      input[type="month"],
      select {
        width: 100%;
        padding: 12px 15px;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 16px;
        transition: 0.3s;
        box-sizing: border-box; /* Input taşmasını engeller */
      }
      input:focus {
        outline: none;
        border-color: #4b4b8f;
        box-shadow: 0 0 8px rgba(75, 75, 143, 0.2);
      }
      .button {
        background: linear-gradient(90deg, #4b4b8f, #6a6aff);
        border: none;
        color: white;
        padding: 12px 25px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.3s;
        width: 100%;
      }
      .button:hover {
        background: linear-gradient(90deg, #6a6aff, #4b4b8f);
        transform: scale(1.02);
      }
      a {
        display: inline-block;
        margin-top: 25px;
        text-decoration: none;
        color: #4b4b8f;
        font-weight: 600;
        transition: 0.3s;
      }
      a:hover {
        color: #1a237e;
      }
    </style>
  </head>
  <body>
    <header>Merhaba, {{ g.username }}!</header>

    <main>
      {% if mesaj %}
      <div
        class="alert {% if odeme_basarili %}alert-success{% else %}alert-danger{% endif %}"
      >
        {{ mesaj }}
      </div>
      {% endif %}

      <p>Toplam Borç Miktarı:</p>

      <p
        class="borc"
        style="color: {{ 'green' if toplam_borc == 0 else '#ff6b6b' }}"
      >
        {{ toplam_borc }} TL
      </p>

      {% if toplam_borc|float > 0 %}
      <p>Borç ödemeden yeni kitap ödünç alamazsınız!</p>

      <form
        method="POST"
        action="{{ url_for('kendiborc_ode', username=g.username) }}"
      >
        <label style="align-self: flex-start; font-size: 14px; color: #666"
          >Kart Sahibi</label
        >
        <input type="text" name="kart_sahibi" value="PAYTR TEST" readonly />

        <label style="align-self: flex-start; font-size: 14px; color: #666"
          >Kart Numarası</label
        >
        <input
          type="text"
          name="kart_numarasi"
          value="4355084355084358"
          readonly
        />

        <div style="display: flex; gap: 10px; width: 100%">
          <div style="flex: 1">
            <label style="font-size: 14px; color: #666">Son Kul.</label>
            <input
              type="month"
              name="kart_son_kullanma"
              value="2030-12"
              readonly
            />
          </div>
          <div style="flex: 1">
            <label style="font-size: 14px; color: #666">CVV</label>
            <input type="text" name="cvv" value="000" readonly />
          </div>
        </div>

        <button type="submit" class="button">
          Ödemeyi Tamamla ({{ toplam_borc }} TL)
        </button>
      </form>

      {% else %}
      <div class="alert alert-success" style="margin-top: 20px">
        Şu an ödenmesi gereken bir borcunuz bulunmamaktadır. Keyifli okumalar!
      </div>
      {% endif %}

      <a href="{{ url_for('kullanici_sayfasi', username=g.username) }}"
        >← Anasayfaya Dön</a
      >
    </main>
  </body>
</html>
