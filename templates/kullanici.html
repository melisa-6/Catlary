<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Kullanıcı Anasayfa</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
      }

      h2 {
        margin-bottom: 10px;
      }
      .mesajlar .success {
        background-color: #d4edda;
        color: #155724;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
      }

      .mesajlar .error {
        background-color: #f8d7da;
        color: #721c24;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
      }

      p {
        margin-bottom: 40px;
      }

      .butonlar {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }

      .gizli-alan {
        background: #f5f5f5;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
        border: 1px solid #ddd;
      }

      .gizli-alan form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }

      .gizli-alan input {
        padding: 8px;
        width: 250px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .gizli-alan .buton-grubu {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      a {
        margin-top: 50px;
        color: blue;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h2>Hoşgeldin, {{ g.username }}!</h2>
    <p>Burası kullanıcı anasayfasıdır.</p>

    <div class="butonlar">
      <button onclick="window.location.href='/kitaplari_goruntule'">
        Kitapları Görüntüle
      </button>

      <button
        onclick="window.location.href='/oduncalmagecmisim/{{ g.username }}'"
      >
        Ödünç Alma Geçmişim
      </button>

      <button
        onclick="window.location.href='/cezalarimigoster/{{ g.username }}'"
      >
        Cezalarımı Göster
      </button>

      <button onclick="toggleGizliAlan()">Şifre Değiştir</button>

      <button onclick="window.location.href='/kendiborc_ode/{{ g.username }}'">
        Borcu Öde
      </button>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %}
    <div class="mesajlar">
      {% for category, message in messages %}
      <p class="{{ category }}">{{ message }}</p>
      {% endfor %}
    </div>
    {% endif %} {% endwith %}

    <div class="gizli-alan" id="sifreAlani" style="display: none">
      <h3>Şifre Değiştir</h3>

      <form action="/kullanici_sifre_degistir" method="POST" class="hash-form">
        <input type="hidden" name="username" value="{{ g.username }}" />

        <input
          type="password"
          name="eski_sifre"
          placeholder="Eski Şifre"
          required
        />
        <input
          type="password"
          name="yeni_sifre"
          placeholder="Yeni Şifre"
          required
        />
        <input
          type="password"
          name="yeni_sifre_tekrar"
          placeholder="Yeni Şifre (Tekrar)"
          required
        />

        <div class="buton-grubu">
          <button type="submit">Şifreyi Değiştir</button>
          <button type="button" onclick="iptal()">İptal</button>
        </div>
      </form>
    </div>

    <script>
      function toggleGizliAlan() {
        var gizliAlan = document.getElementById("sifreAlani");
        if (gizliAlan.style.display === "none") {
          gizliAlan.style.display = "block";
        } else {
          gizliAlan.style.display = "none";
        }
      }

      function iptal() {
        var gizliAlan = document.getElementById("sifreAlani");
        gizliAlan.style.display = "none";

        var form = gizliAlan.querySelector("form");
        form.reset();
      }

      // Şifreleme Fonksiyonu (SHA-256)
      async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
        return hashHex;
      }

      //  Formları Yakala ve Göndermeden Önce Şifrele
      document.querySelectorAll(".hash-form").forEach((form) => {
        form.addEventListener("submit", async function (e) {
          e.preventDefault(); // Formun hemen gitmesini engelle

          // Form içindeki tüm şifre alanlarını bul
          const passwordInputs = form.querySelectorAll(
            'input[type="password"]'
          );

          // Her bir şifre alanını tek tek hashle
          for (let input of passwordInputs) {
            if (input.value) {
              // Boş değilse
              input.value = await sha256(input.value);
            }
          }

          // Hashlenmiş verilerle formu sunucuya gönder
          this.submit();
        });
      });
    </script>

    <a href="/cikis">Çıkış Yap</a>
  </body>
</html>
