<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Kullanıcı Anasayfa</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
      }

      h2 {
        margin-bottom: 10px;
      }

      p {
        margin-bottom: 40px;
      }

      .butonlar {
        display: flex;
        gap: 20px;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }

      a {
        margin-top: 50px;
        color: blue;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h2>Hoşgeldin, {{ username }}!</h2>
    <p>Burası kullanıcı anasayfasıdır.</p>

    <div class="butonlar">
      <button
        onclick="window.location.href='/kitaplari_goruntule/{{ username }}'"
      >
        Kitapları Görüntüle
      </button>

      <button
        onclick="window.location.href='/oduncalmagecmisim/{{ username }}'"
      >
        ödunç alma geçmişimi görüntüle
      </button>

      <button onclick="window.location.href='/cezalarimigoster/{{ username }}'">
        cezalarimi goster
      </button>

      <button onclick="toggleGizliAlan()">Şifre Değiştir</button>
    </div>

    <!-- gizli alan (sifreAlani) -->
    <div class="gizli-alan" id="sifreAlani" style="display: none">
      <h3>Yeni Şifre Belirle</h3>

      <form action="/kullanicisifredegis/{{ username }}" method="POST">
        <input
          type="password"
          name="yeni_sifre"
          placeholder="Yeni şifrenizi girin"
          required
        /><br />
        <input
          type="password"
          name="yeni_sifre_tekrar"
          placeholder="Yeni şifreyi tekrar girin"
          required
        /><br />
        <button type="submit">Kaydet</button>
        <button type="button" onclick="iptal()">İptal</button>
      </form>
    </div>
    <script>
      function toggleGizliAlan() {
        var gizliAlan = document.getElementById("sifreAlani");
        if (gizliAlan.style.display === "none") {
          gizliAlan.style.display = "block";
        } else {
          gizliAlan.style.display = "none";
        }
      }

      function iptal() {
        var gizliAlan = document.getElementById("sifreAlani");
        gizliAlan.style.display = "none";
      }
    </script>
    <a href="/">Çıkış Yap</a>
  </body>
</html>
